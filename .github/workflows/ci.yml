name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test
        run: uv run pytest

  backend-postgres:
    # The same tests on PostgreSQL, the database of development (ADR-008): SQLite hides differences
    # such as JSONB not keeping the order of object keys.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: narrative
          POSTGRES_PASSWORD: narrative
          POSTGRES_DB: narrative_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narrative -d narrative_engine"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --frozen
      - name: Test on PostgreSQL
        run: uv run pytest --ds=narrative_engine.settings.test_postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Before setup-node, so that its Yarn cache uses the Yarn of packageManager (ADR-010).
      - name: Enable Corepack
        working-directory: .
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies from the lock file
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Check formatting
        run: yarn format:check
      - name: Type check
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: API types match the backend's OpenAPI schema
        run: |
          (cd ../backend && uv sync --frozen)
          yarn generate:api-types
          git diff --exit-code -- openapi.json src/api/schema.d.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies from the lock files
        run: |
          (cd backend && uv sync --frozen)
          yarn install --immutable
      - name: Install the browser
        working-directory: e2e
        run: yarn playwright install --with-deps chromium
      - name: Browser tests of the scenarios in docs/usage
        working-directory: e2e
        run: yarn playwright test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
