# Install once with: cd backend && uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  # mypy and pytest run inside the project environment, so django-stubs and the
  # Django settings are the same as in CI instead of a separately pinned copy.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --directory backend pytest -q
        language: system
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint, format and types
        entry: bash -c "cd frontend && npm run --silent lint && npm run --silent format:check && npm run --silent typecheck"
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-test
        name: frontend tests
        entry: bash -c "cd frontend && npm test --silent"
        language: system
        files: ^frontend/
        pass_filenames: false
